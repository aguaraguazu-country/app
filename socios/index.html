<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
/* Layout: columna angosta tipo app de celular; tarjeta de ingreso; después, saludo + mis lotes + cambiar contraseña */
:root{--bg:#f6f7f4;--card:#fff;--fg:#1d2420;--muted:#5d6862;--line:#d9ddd6;--accent:#2f6b4f;--accent-soft:#e3efe8;--warn-bg:#fbf0dc;--crit:#b42318;--good:#2f7d4f;
 --display:'Fraunces',Georgia,serif;--body:'Public Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141916;--card:#1c2320;--fg:#e6ebe7;--muted:#9aa59f;--line:#2f3833;--accent:#7cc39f;--accent-soft:#1f3329;--warn-bg:#2f2615;--crit:#f2867b;--good:#7cc39f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141916;--card:#1c2320;--fg:#e6ebe7;--muted:#9aa59f;--line:#2f3833;--accent:#7cc39f;--accent-soft:#1f3329;--warn-bg:#2f2615;--crit:#f2867b;--good:#7cc39f;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:520px;margin:0 auto;padding-block:max(20px,env(safe-area-inset-top,0px)) 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:600;font-size:28px;margin:2px 0 0;line-height:1.15}
h2{font-size:18px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:12px}
label{font-weight:600;font-size:14px;display:grid;gap:5px}
input{font:inherit;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);width:100%}
.check{display:flex;gap:8px;align-items:center;font-weight:400;font-size:14px}.check input{width:18px;height:18px;accent-color:var(--accent)}
.btn{font:inherit;font-weight:600;border-radius:10px;padding:12px 16px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--card)}.btn[disabled]{opacity:.6;cursor:wait}
.err{color:var(--crit);font-size:14px;min-height:1.2em}.ok{color:var(--good);font-size:14px}
.help{color:var(--muted);font-size:14px;margin:0}
.lot{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg)}
.mono{font-family:var(--mono);font-size:14px}
.note{background:var(--warn-bg);border-radius:10px;padding:12px;font-size:14px}
.soon{display:grid;gap:6px}.soon div{display:flex;justify-content:space-between;color:var(--muted);font-size:15px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.big{font-family:var(--display);font-size:34px;font-weight:600;line-height:1.1}.big.crit{color:var(--crit)}.big.good{color:var(--good)}
.rows{display:grid;gap:8px}.row{display:flex;justify-content:space-between;gap:10px;font-size:15px;border-bottom:1px dashed var(--line);padding-bottom:7px}.row b{font-variant-numeric:tabular-nums;white-space:nowrap}
.lbl{display:grid;gap:3px;justify-items:start}.tag{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--warn-bg);border-radius:6px;padding:2px 6px;}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.mo{border:1px solid var(--line);border-radius:10px;padding:8px;font-size:13px;display:grid;gap:2px;background:var(--bg)}.mo span{color:var(--muted);font-size:12px;text-transform:capitalize}
.mo.ok{border-color:var(--good);background:var(--accent-soft)}.mo.ok b{color:var(--good)}.mo.warn{border-color:#c98a1c;background:var(--warn-bg)}.mo.warn b{color:#9a6400}.big.warn{color:#9a6400}.mo.bad{border-color:var(--crit)}.mo.bad b{color:var(--crit)}
.pay{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}.pay:last-child{border-bottom:0}.pay small{color:var(--muted);display:block}.pay b{white-space:nowrap;font-variant-numeric:tabular-nums}
.it{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px;background:var(--bg)}.it .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.it small{color:var(--muted);font-size:13px}.lnk{background:none;border:0;color:var(--crit);font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:2px 0}
.lnk.g{color:var(--accent)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.prow{display:grid;grid-template-columns:1.4fr 1fr auto;gap:8px;align-items:end}
.sec{display:grid;gap:10px}.pill{font-size:12px;border-radius:999px;padding:2px 8px;background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap}
.wa{display:block;text-align:center;text-decoration:none;background:#1f7a4d;border-color:#1f7a4d;color:#fff}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>

<div class="wrap">
<header><div class="eyebrow">Aguará Guazú Country</div><h1>App de socios<span class="agver" aria-label="Versión del sistema" style="font:500 12px/1.2 system-ui,sans-serif;color:var(--muted,#5d6862);margin-left:10px;white-space:nowrap;vertical-align:middle;letter-spacing:0">v1.41 · 04/11/26 11:02</span></h1></header>
<main id="main"><p class="help">Cargando…</p></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>
const SB_URL='https://ejyfijaahbobvbpxtsfj.supabase.co',SB_KEY='sb_publishable_fDK_li5-1Yr9kW-ynu4s7A_Rr652rif',TK='ag_socio_token';
const sb=window.supabase?window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false}}):null;
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tokGet=()=>{try{return localStorage.getItem(TK)}catch(_){return S.tok}},tokSet=v=>{S.tok=v;try{v?localStorage.setItem(TK,v):localStorage.removeItem(TK)}catch(_){}};
const S={tok:null,yo:null,ec:null,ac:null,form:null,inq:null,show:false,cp:false};
const WA='5493786610915';
const $$=n=>'$ '+Math.abs(Math.round(n||0)).toLocaleString('es-AR');
const MES=m=>{const [y,mm]=m.split('-');return ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][+mm-1]+' '+y.slice(2)};
const FEC=f=>f?f.split('-').reverse().join('/'):'';

const hoyISO=()=>new Date().toLocaleDateString('sv');
const F2=d=>d?d.split('-').reverse().slice(0,2).join('/'):'';
const rango=(a,b)=>a===b?F2(a):F2(a)+' al '+F2(b);
const F3=d=>d?d.split('-').reverse().join('/').replace(/\/(\d\d)(\d\d)$/,'/$2'):'';
function vAccesos(){const a=S.ac;
 if(!a)return '<div class="card"><h2>Visitas e inquilinos</h2><p class="help">Cargando…</p></div>';
 if(a.hide)return '';
 if(a.error)return `<div class="card"><h2>Visitas e inquilinos</h2><p class="help">${esc(a.error)}</p></div>`;
 a.visitas=a.visitas||[];a.inquilinos=a.inquilinos||[];
 const vis=a.visitas.map(v=>`<div class="it"><div class="top"><b>${esc(v.nombre)}</b>${v.ingresos?'<span class="pill">Ingresó</span>':''}</div>
   <small>DNI ${esc(v.dni)}${v.patente?' · Patente '+esc(v.patente):''} · ${rango(v.desde,v.hasta)}${v.origen==='guardia'?' · cargada por la guardia':''}</small>
   ${v.hasta>=hoyISO()?`<div><button class="lnk" data-anv="${v.id}">Quitar autorización</button></div>`:''}</div>`).join('');
 const fv=S.form==='visita'?`<form id="fv" class="sec"><label>Nombre y apellido<input id="vn" autocomplete="off"></label>
   <div class="grid2"><label>DNI<input id="vd" inputmode="numeric" autocomplete="off"></label><label>Patente <span class="help" style="font-weight:400">(si viene en auto)</span><input id="vp" autocomplete="off" style="text-transform:uppercase"></label></div>
   <div class="grid2"><label>Ingresa el<input id="v1" type="date" min="${hoyISO()}" value="${hoyISO()}"></label><label>Se va el<input id="v2" type="date" min="${hoyISO()}" value="${hoyISO()}"></label></div>
   <div class="err" id="verr"></div><button class="btn primary" id="vb">Autorizar visita</button><button type="button" class="btn" data-cerrar="1">Cancelar</button></form>`
   :'<button class="btn" type="button" data-abrir="visita">+ Autorizar una visita</button>';
 const inq=a.inquilinos.map(i=>`<div class="it"><div class="top"><b>${i.personas.map(p=>esc(p.nombre)).join(', ')}</b><span class="pill">${F3(i.desde)} al ${F3(i.hasta)}</span></div>
   <small>${i.personas.length} ${i.personas.length==1?'persona':'personas'}${i.vehiculos.length?' · Patentes: '+i.vehiculos.map(esc).join(', '):''}</small>
   <div style="display:flex;gap:16px"><button class="lnk g" data-edi="${i.id}">Editar</button><button class="lnk" data-ani="${i.id}">Quitar</button></div></div>`).join('');
 let fi='<button class="btn" type="button" data-abrir="inq">+ Cargar inquilinos</button>';
 if(S.form==='inq'){const e=S.inq;
  fi=`<form id="fi" class="sec"><div class="grid2"><label>Desde<input id="i1" type="date" value="${e.desde||hoyISO()}"></label><label>Hasta<input id="i2" type="date" value="${e.hasta||''}"></label></div>
   <b style="font-size:14px">Personas que van a vivir</b>${e.personas.map((p,k)=>`<div class="prow"><label>Nombre y apellido<input data-pn="${k}" value="${esc(p.nombre)}" autocomplete="off"></label><label>DNI<input data-pd="${k}" value="${esc(p.dni)}" inputmode="numeric" autocomplete="off"></label>${e.personas.length>1?`<button type="button" class="lnk" data-qp="${k}" aria-label="Quitar persona">✕</button>`:'<span></span>'}</div>`).join('')}
   ${e.personas.length<20?'<button type="button" class="lnk g" data-ap="1" style="justify-self:start">+ Agregar otra persona</button>':''}
   <b style="font-size:14px">Patentes de sus vehículos <span class="help" style="font-weight:400">(opcional)</span></b>
   <div class="grid2">${e.vehiculos.map((v,k)=>`<input data-pv="${k}" value="${esc(v)}" placeholder="Patente" style="text-transform:uppercase" autocomplete="off">`).join('')}</div>
   ${e.vehiculos.length<6?'<button type="button" class="lnk g" data-av="1" style="justify-self:start">+ Agregar otra patente</button>':''}
   <div class="err" id="ierr"></div><button class="btn primary" id="ib">${e.id?'Guardar cambios':'Guardar inquilinos'}</button><button type="button" class="btn" data-cerrar="1">Cancelar</button></form>`}
 return `<div class="card"><h2>Mis visitas</h2><p class="help">Avisale a la guardia quién viene. Al llegar, muestran el DNI.</p>${vis||''}${fv}</div>
  <div class="card"><h2>Inquilinos</h2><p class="help">Si alquilás tu casa, cargá quiénes viven y hasta cuándo. La guardia los va a ver como habilitados.</p>${inq||''}${fi}</div>`}
function leerInq(){const e=S.inq;document.querySelectorAll('[data-pn]').forEach(x=>e.personas[+x.dataset.pn].nombre=x.value);document.querySelectorAll('[data-pd]').forEach(x=>e.personas[+x.dataset.pd].dni=x.value);
 document.querySelectorAll('[data-pv]').forEach(x=>e.vehiculos[+x.dataset.pv]=x.value);const a=$('#i1'),b=$('#i2');if(a)e.desde=a.value;if(b)e.hasta=b.value}
async function cargarAccesos(){const r=await sb.rpc('socio_accesos',{p_token:S.tok});S.ac=r.error?(/verifique/.test(r.error.message)?{error:'Vas a poder cargar visitas e inquilinos cuando la comisión verifique tu ficha.'}:/venci/i.test(r.error.message)?{error:r.error.message}:{hide:true}):r.data;if(S.yo&&!S.form)vHome()}

function vCuenta(){const e=S.ec,y=S.yo;
 const wa=t=>`<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${encodeURIComponent(t)}">Consultar a tesorería por WhatsApp</a>`;
 const base='Hola, soy '+(y.nombre||'')+'. Quiero consultar mi estado de cuenta.';
 if(!e)return '<div class="card"><h2>Mi cuenta</h2><p class="help">Cargando tu estado de cuenta…</p></div>';
 if(e.error)return '';
 if(e.estado==='ficha_no_verificada')return `<div class="card"><h2>Mi cuenta</h2><p class="help">Tu estado de cuenta va a aparecer acá cuando la comisión verifique tu ficha.</p></div>`;
 if(!(e.cuentas||[]).length)return `<div class="card"><h2>Mi cuenta</h2><p class="help">Todavía no tenemos tu estado de cuenta cargado.</p>${wa(base)}</div>`;
 return e.cuentas.map(c=>{const tot=c.total||0,al=tot<=0;
  const ant=c.tipo_deuda?c.tipo_deuda==='Antigua':true,ap=c.a_pagar||0,venc=Math.max(0,tot-ap),vd=c.vence_dia||10;
  const mesAct=new Date().toLocaleDateString('es-AR',{month:'long'});const vt=String(vd).padStart(2,'0')+'/'+String(new Date().getMonth()+1).padStart(2,'0');
  const head=al?(tot<0?`<div class="big good">${$$(tot)} a favor</div><p class="help">Estás al día y tenés pagos adelantados.</p>`:`<div class="big good">Estás al día</div>`)
   :venc<=0?`<div class="big warn">${$$(ap)}</div><p class="help">Cuota de ${mesAct} a pagar · vence el ${vt}</p>`
   :`<div class="big crit">${$$(tot)}</div><p class="help">Total adeudado${c.meses_atraso?` · equivale a ${c.meses_atraso} ${c.meses_atraso==1?'cuota':'cuotas'} aprox.`:''}</p>`;
  const rows=[];
  if(c.deuda_mes)rows.push(`<div class="row"><span>Cuotas vencidas sin pagar</span><b>${$$(c.deuda_mes)}</b></div>`);
  if(ap)rows.push(`<div class="row"><span>Cuota de ${mesAct} (vence el ${vt})</span><b>${$$(ap)}</b></div>`);
  if(!ant&&c.deuda_antigua>0)rows.push(`<div class="row"><span>Meses anteriores sin pagar</span><b>${$$(c.deuda_antigua)}</b></div>`);
  if(ant&&(c.deuda_antigua_inicial||c.deuda_antigua))rows.push(`<div class="row"><span class="lbl">Deuda anterior a nov-2026<span class="tag">en revisión</span></span><b>${$$(c.deuda_antigua)}</b></div>`);
  if(c.a_favor>0)rows.push(`<div class="row"><span>Pagado por adelantado</span><b>− ${$$(c.a_favor)}</b></div>`);
  if(c.cuota_mes)rows.push(`<div class="row"><span>Tu cuota mensual${c.cant_lotes>1?` (${c.cant_lotes} lotes)`:''}</span><b>${$$(c.cuota_mes)}</b></div>`);
  const hoy=new Date().toLocaleDateString('sv').slice(0,7),fut=(c.meses||[]).filter(m=>m.mes>hoy),ult=fut.length?fut[fut.length-1].mes:null;
  const meses=(c.meses||[]).filter(m=>m.mes<=hoy).map(m=>{const ok=m.estado.charAt(0)==='✔',bad=m.estado.charAt(0)==='✘',wr=m.estado.charAt(0)==='⏳';
   const t=ok?(m.estado.replace(/^✔\s*/,'').replace(/^F\s*/,'Factura ')||'pagado'):bad?'impaga':wr?'a pagar':'—';
   return `<div class="mo ${ok?'ok':bad?'bad':wr?'warn':''}"><span>${MES(m.mes)}</span><b>${ok?'✔ ':bad?'✘ ':''}${esc(t.charAt(0).toUpperCase()+t.slice(1))}</b></div>`}).join('');
  const pagos=(c.pagos||[]).map(p=>{const aj=/^Ajuste/.test(p.tipo),ad=/^Adelanto/.test(p.tipo);
   const tit=aj?(p.a_antigua<0?'Corrección: suma a la deuda anterior':'Corrección: baja la deuda anterior'):ad?'Pago adelantado (registro anterior)':'Pago'+(p.medio?' · '+esc(p.medio):'');
   const det=aj?'':[p.a_cuotas?$$(p.a_cuotas)+' a cuotas':'',p.a_antigua?$$(p.a_antigua)+((!c.tipo_deuda||c.tipo_deuda==='Antigua')?' a deuda anterior':' a meses anteriores'):''].filter(Boolean).join(' · ');
   return `<div class="pay"><div>${esc(tit)}<small>${FEC(p.fecha)}${p.factura?' · Factura '+esc(p.factura):''}${det?' · '+det:''}</small></div><b>${aj?(p.a_antigua<0?'+ ':'− ')+$$(p.a_antigua):$$(p.importe)}</b></div>`}).join('');
  const act=c.actualizado?(d=>d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'})+' a las '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false})+' hs')(new Date(c.actualizado)):'';
  return `<div class="card"><h2>Mi cuenta${e.cuentas.length>1?' · '+esc(c.lotes||c.id):''}</h2>${head}<div class="rows">${rows.join('')}</div>
   ${ant&&c.deuda_antigua?'<p class="help">La deuda anterior a noviembre 2026 sale de los registros anteriores de la asociación y la comisión la está revisando. Si no coincide con lo que pagaste, consultá con tus comprobantes.</p>':''}
   ${meses?`<h2 style="font-size:16px">Mes a mes</h2><div class="months">${meses}</div>`:''}
   ${ult?`<p class="help" style="color:var(--good);font-weight:600">✔ Cuotas pagadas por adelantado hasta ${MES(ult)}</p>`:''}
   ${pagos?`<h2 style="font-size:16px">Últimos pagos registrados</h2><div>${pagos}</div>`:''}
   <p class="help">Cada pago cubre primero el mes más viejo que debés${ant?' (la deuda anterior a noviembre se arregla aparte con tesorería)':''}. Actualizado al ${act}. Los pagos aparecen cuando tesorería los registra.</p>${wa(base+(c.lotes?' (lote '+c.lotes+')':''))}</div>`}).join('')}
function vLogin(msg){$('#main').innerHTML=`<div class="card"><h2>¿Primera vez?</h2><p class="help">Si todavía no cargaste tu ficha de propietario, empezá acá. Al final elegís tu contraseña.</p><a class="btn" style="display:block;text-align:center;text-decoration:none" href="../ficha/">Completar mi ficha</a></div>
 <form class="card" id="lf"><h2>Ya tengo cuenta</h2>
 <label>DNI <span class="help" style="font-weight:400">(solo números, sin puntos)</span><input id="dni" inputmode="numeric" autocomplete="username" maxlength="11"></label>
 <label>Contraseña<input id="pw" type="${S.show?'text':'password'}" autocomplete="current-password"></label>
 <label class="check"><input type="checkbox" id="show" ${S.show?'checked':''}>Mostrar lo que escribo</label>
 <div class="err" id="lerr">${esc(msg||'')}</div><button class="btn primary" id="lb" type="submit">Ingresar</button>
 <p class="help">¿Ya cargaste la ficha pero te olvidaste la contraseña? Escribile a la comisión y te dan una nueva.</p></form>`}
function vHome(){const y=S.yo;$('#main').innerHTML=`${y.provisoria?'<div class="note">Estás usando una contraseña provisoria. Te recomendamos cambiarla por una tuya (abajo).</div>':''}
 <div class="card"><h2>Hola, ${esc(y.nombre)}</h2><p class="help">Ficha ${esc(y.tramite)}</p>
 ${(y.lotes||[]).length?y.lotes.map(l=>`<div class="lot"><span>${l.sector==='S1'?'Sector 1':'Sector 2'} · Mz ${esc(l.manzana)} · Lote ${l.parcela}</span><span class="mono">${esc(l.partida)}</span></div>`).join(''):'<p class="help">Tus lotes todavía no están identificados en el plano.</p>'}</div>
${vCuenta()}
 ${vAccesos()}
 <div class="card"><button type="button" class="btn" id="tcp">${S.cp||y.provisoria?'Cambiar contraseña':'Cambiar contraseña…'}</button>
 <form id="cpf" ${S.cp||y.provisoria?'':'hidden'} style="display:grid;gap:10px"><label>Contraseña actual<input id="pa" type="password" autocomplete="current-password"></label>
 <label>Nueva contraseña<input id="pn" type="password" autocomplete="new-password"></label><label>Repetí la nueva<input id="pn2" type="password" autocomplete="new-password"></label>
 <p class="help">Al menos 6 caracteres. No uses tu DNI, ni 123456, ni el mismo número repetido.</p><div class="err" id="cperr"></div><button class="btn primary" type="submit" id="cpb">Guardar contraseña nueva</button></form></div>
 <button class="btn" id="out" type="button">Salir</button>`}
async function cargar(){const {data,error}=await sb.rpc('socio_yo',{p_token:S.tok});if(error){tokSet(null);return vLogin(/venci/i.test(error.message)?'Tu sesión venció. Volvé a ingresar.':'')}S.yo=data;S.ec=null;vHome();
 cargarAccesos();const r=await sb.rpc('socio_estado_cuenta',{p_token:S.tok});S.ec=r.error?{error:true}:r.data;if(S.yo&&!S.form)vHome()}
async function start(){if(!sb){$('#main').innerHTML='<div class="card">No se pudo cargar la app. Revisá tu conexión y recargá.</div>';return}S.tok=tokGet();if(S.tok)return cargar();vLogin()}
document.addEventListener('input',e=>{if(e.target.id==='dni')e.target.value=e.target.value.replace(/\D/g,'')});
document.addEventListener('change',e=>{if(e.target.id==='show'){S.show=e.target.checked;$('#pw').type=S.show?'text':'password'}});
document.addEventListener('click',e=>{if(e.target.id==='out'){tokSet(null);S.yo=null;S.ec=null;S.ac=null;S.form=null;vLogin()}
 const d=e.target.dataset||{};
 if(d.abrir){S.form=d.abrir;if(d.abrir==='inq')S.inq={personas:[{nombre:'',dni:''}],vehiculos:['']};vHome();const f=$(d.abrir==='inq'?'#i2':'#vn');if(f)f.focus()}
 if(d.cerrar){S.form=null;vHome()}
 if(d.ap){leerInq();S.inq.personas.push({nombre:'',dni:''});vHome()}
 if(d.qp){leerInq();S.inq.personas.splice(+d.qp,1);vHome()}
 if(d.av){leerInq();S.inq.vehiculos.push('');vHome()}
 if(d.edi){const i=S.ac.inquilinos.find(x=>x.id==d.edi);S.inq={id:i.id,desde:i.desde,hasta:i.hasta,personas:i.personas.map(p=>({...p})),vehiculos:i.vehiculos.length?[...i.vehiculos]:['']};S.form='inq';vHome()}
 if(d.anv&&confirm('¿Quitar la autorización de esta visita?')){sb.rpc('socio_visita_anular',{p_token:S.tok,p_id:+d.anv}).then(r=>{if(r.error)alert(r.error.message);cargarAccesos()})}
 if(d.ani&&confirm('¿Quitar a estos inquilinos? La guardia ya no los va a ver como habilitados.')){sb.rpc('socio_inquilino_anular',{p_token:S.tok,p_id:+d.ani}).then(r=>{if(r.error)alert(r.error.message);cargarAccesos()})}if(e.target.id==='tcp'){S.cp=!S.cp;vHome()}});
document.addEventListener('submit',async e=>{e.preventDefault();
 if(e.target.id==='fv'){const err=$('#verr'),b=$('#vb');err.textContent='';const p={nombre:$('#vn').value,dni:$('#vd').value,patente:$('#vp').value,desde:$('#v1').value,hasta:$('#v2').value};
  if(!p.nombre.trim()||!p.dni.trim()){err.textContent='Escribí el nombre y el DNI de la visita.';return}
  b.disabled=true;const r=await sb.rpc('socio_visita_guardar',{p_token:S.tok,p});b.disabled=false;if(r.error){err.textContent=r.error.message;return}S.form=null;await cargarAccesos();vHome()}
 if(e.target.id==='fi'){leerInq();const err=$('#ierr'),b=$('#ib'),q=S.inq;err.textContent='';
  if(!q.hasta){err.textContent='Elegí hasta qué fecha alquilan.';return}
  const per=q.personas.filter(p=>p.nombre.trim()||p.dni.trim());if(!per.length){err.textContent='Cargá al menos una persona con nombre y DNI.';return}
  if(per.some(p=>!p.nombre.trim()||!p.dni.trim())){err.textContent='Cada persona necesita nombre y DNI.';return}
  b.disabled=true;const r=await sb.rpc('socio_inquilino_guardar',{p_token:S.tok,p:{id:q.id||null,desde:q.desde,hasta:q.hasta,personas:per,vehiculos:q.vehiculos.filter(v=>v.trim())}});b.disabled=false;
  if(r.error){err.textContent=r.error.message;return}S.form=null;await cargarAccesos();vHome()}
 if(e.target.id==='lf'){const b=$('#lb'),err=$('#lerr');err.textContent='';const dni=$('#dni').value,pw=$('#pw').value;if(!dni||!pw){err.textContent='Escribí tu DNI y tu contraseña.';return}
  b.disabled=true;const {data,error}=await sb.rpc('login_socio',{p_doc:dni,p_pass:pw});b.disabled=false;
  if(error){err.textContent='No se pudo ingresar. Revisá tu conexión.';return}if(data.error){err.textContent=data.error;return}tokSet(data.token);await cargar()}
 if(e.target.id==='cpf'){const err=$('#cperr'),pn=$('#pn').value;err.textContent='';if(pn!==$('#pn2').value){err.textContent='Las dos contraseñas nuevas no coinciden.';return}
  const b=$('#cpb');b.disabled=true;const {error}=await sb.rpc('cambiar_pass_socio',{p_token:S.tok,p_actual:$('#pa').value,p_nueva:pn});b.disabled=false;
  if(error){err.textContent=error.message;return}S.cp=false;S.yo.provisoria=false;vHome();$('#main').insertAdjacentHTML('afterbegin','<div class="card ok">Listo, guardamos tu contraseña nueva.</div>')}});
start();
</script>
</body>
</html>
