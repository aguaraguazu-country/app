  <section><h3>Cuenta</h3>${p?`${kv('Según planilla',p.deuda_planilla==null?'Sin dato':+p.deuda_planilla>0?`<b>${$$(p.deuda_planilla)}</b> · ${p.meses_planilla??'?'} meses × ${$$(p.cuota_planilla)}`:'Al día')}${kv('Última factura',esc(p.ultima_factura||'—'))}${kv('Facturación',d.facturacion&&d.facturacion.a_nombre!=='titular'?esc(d.facturacion.a_nombre+' · '+(d.facturacion.cuit||'')):'A nombre del titular')}<button type="button" class="link" data-pad="${esc(p.id)}">Ver en el padrón (${esc(p.id)})</button>`:'<p class="help">No figura en el padrón ni en la planilla de cobranza.</p>'}</section>
  ${d.apoderado?`<section><h3>Apoderado</h3>${kv(esc(d.apoderado.relacion||'Apoderado'),`${esc(d.apoderado.nombre)}<div class="mono">${esc(tel(d.apoderado.celular))}</div>${esc(d.apoderado.email||'')}`)}</section>`:''}
  ${d.comentarios?`<section><h3>Comentario del propietario</h3><p>${esc(d.comentarios)}</p></section>`:''}
 </aside></div>
 <footer class="pf-foot"><label class="pf-nota">Nota de la comisión<textarea id="nota-${f.id}" rows="1" placeholder="Visible solo para la comisión">${esc(f.nota_comision||'')}</textarea></label>
 <div class="pf-btns"><button type="button" class="btn sm" data-set="verificada" data-id="${f.id}">Guardar nota</button><button type="button" class="btn sm" data-reset="${f.id}">Resetear contraseña</button><span class="sp"></span><button type="button" class="btn sm" data-set="pendiente" data-id="${f.id}">Volver a pendiente</button><button type="button" class="btn sm danger" data-set="rechazada" data-id="${f.id}">Rechazar</button></div>
 <div id="rst-${f.id}"></div><div class="err" id="ferr-${f.id}"></div></footer>`}
function drawer(){if(!S.open)return'';let head='',body='';
 {const fv=S.open.ficha&&S.fichas.find(x=>x.id===S.open.ficha);if(fv&&fv.estado==='verificada')return`<div class="scrim" data-close></div><div class="modal" role="dialog" aria-label="Ficha del propietario">${propHTML(fv)}</div>`}
 if(S.open.lot){const i=lotInfo(S.open.lot),fs=S.byLot[S.open.lot]||[];head=`<div><h2>${esc(i.nom)}</h2><span class="mono help">${esc(i.partida)} · ${i.sup!=null?i.sup.toLocaleString('es-AR')+' m²':''}</span></div>`;
  body=fs.length?(fs.length>1?`<div class="note">Hay ${fs.length} fichas que reclaman este lote. Revisá cuál corresponde y rechazá la otra.</div>`:'')+fs.map(fichaHTML).join(''):'<div class="empty">Ningún propietario cargó todavía este lote.</div>'}
 else if(S.open.pad){const x=(cruce()||[]).find(y=>y.id===S.open.pad);head='<div><h2>Padrón</h2></div>';body=x?padHTML(x):''}
 else{const f=S.fichas.find(x=>x.id===S.open.ficha);head='<div><h2>Ficha</h2></div>';body=f?fichaHTML(f):''}
 return`<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-label="Tarjeta"><div class="dh">${head}<button type="button" class="x" data-close aria-label="Cerrar">×</button></div>${body}</aside>`}
// ---------- tooltip ----------
const tip=$('#tip');
function showTip(id,x,y){const fs=S.byLot[id]||[];const i=lotInfo(id);
 if(S.v==='deuda'){const r=(S.didx||{})[id],c=dCat(r),p=r&&r.p;tip.innerHTML=`<b>${esc(i.nom)}</b><div class="m mono">${esc(i.partida)}</div>`+(!r?'<div class="m">Sin propietario identificado</div>':`<div>${esc(p?p.nombre:r.f.titular_nombre)}</div><div class="m">Según ${r.src}${r.dud?' (a confirmar)':''}${r.f?' · ficha '+esc(r.f.estado):''}</div>${r.porNom?'<div class="m" style="color:var(--warn)">Deuda vinculada por nombre (el DNI falta en el padrón o no coincide): confirmalo</div>':''}`+(c==='nd'?'<div class="m">Sin dato de deuda</div>':c==='ok'?'<div style="color:var(--good);font-weight:700">Al día</div>':`<div style="font-weight:700">Debe ${$$(p.deuda_planilla)} · ${p.meses_planilla} meses</div>`)+(p&&p.ultima_factura?`<div class="m">Última factura: ${esc(p.ultima_factura)}</div>`:''));
  tip.hidden=false;const rr=tip.getBoundingClientRect();tip.style.left=Math.min(x+14,innerWidth-rr.width-8)+'px';tip.style.top=Math.min(y+14,innerHeight-rr.height-8)+'px';return}
 tip.innerHTML=`<b>${esc(i.nom)}</b>`+(fs.length?fs.map(f=>`<div>${esc(f.titular_nombre)}</div><div class="m mono">${esc(tel(f.celular))}</div><div class="m">${esc(f.email||'')}</div><div class="m">Ficha ${esc(f.estado)} · ${esc(f.tramite)}</div>`).join('<hr style="border:0;border-top:1px solid var(--line);margin:4px 0">'):'<div class="m">Sin ficha cargada</div>');
 tip.hidden=false;const r=tip.getBoundingClientRect();tip.style.left=Math.min(x+14,innerWidth-r.width-8)+'px';tip.style.top=Math.min(y+14,innerHeight-r.height-8)+'px'}
document.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||DR.moved&&DR.on){return}const lt=e.target.closest&&e.target.closest('[data-lot]');if(lt)showTip(lt.dataset.lot,e.clientX,e.clientY);else tip.hidden=true});
// ---------- eventos ----------
document.addEventListener('submit',async e=>{if(e.target.id!=='lf')return;e.preventDefault();const b=$('#lb');b.disabled=true;$('#lerr').textContent='';
 const {data,error}=await sb.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value});b.disabled=false;
 if(error){$('#lerr').textContent=/invalid/i.test(error.message)?'Email o contraseña incorrectos.':error.message;return}S.user=data.user;await loadApp()});
document.addEventListener('click',async e=>{const t=e.target;
 const lt=t.closest('[data-lot]');if(lt&&DR.justDragged)return;if(lt){tip.hidden=true;const r=S.v==='deuda'&&(S.didx||{})[lt.dataset.lot];S.open=r&&r.p?{pad:r.p.id}:{lot:lt.dataset.lot};render();return}
 const dc=t.closest('[data-dcat]');if(dc){const k=dc.dataset.dcat;if(k==='todos')S.dcat=new Set(DCAT.map(x=>x[0]));else{S.dcat.has(k)?S.dcat.delete(k):S.dcat.add(k)}render();return}
 const ds=t.closest('[data-dsrc]');if(ds){S.dsrc=ds.dataset.dsrc;render();return}
 if(t.closest('a[href]'))return;
 const ed=t.closest('[data-edit]');if(ed){const f=S.fichas.find(x=>x.id===+ed.dataset.edit);S.edit=editState(f);render();return}
 if(t.closest('[data-edcancel]')){S.edit=null;render();return}
 if(t.closest('[data-evadd]')){readEdit();S.edit.vehs.push({patente:'',tipo:'Auto',descripcion:''});render();return}
 const evr=t.closest('[data-evrm]');if(evr){readEdit();S.edit.vehs.splice(+evr.dataset.evrm,1);render();return}
 const es=t.closest('[data-edsave]');if(es){readEdit();const id=+es.dataset.edsave,e=S.edit;es.disabled=true;
  const payload={email:e.email,celular:e.celular,whatsapp:e.whatsapp,domicilio_real:{calle:e.calle,localidad:e.localidad,provincia:e.provincia,cp:e.cp},
   contacto_adicional:e.caNom.trim()?{nombre:e.caNom,relacion:e.caRel,celular:e.caTel}:null,vehiculos:e.vehs.filter(v=>v.patente.trim()||v.descripcion.trim())};
  const {data,error}=await sb.rpc('editar_ficha',{p_id:id,p:payload});es.disabled=false;
  if(error){$('#ed-err').innerHTML=/editar_ficha|schema cache|does not exist/i.test(error.message)?'Falta ejecutar el script <b>07_editar_fichas.sql</b> en Supabase.':'No se pudo guardar: '+esc(error.message);return}
  S.edit=null;S.hist=null;const keep=S.open;await loadData();S.open=keep;render();return}
 const tr=t.closest('[data-ficha]');if(tr){S.open={ficha:+tr.dataset.ficha};render();return}
 const pr=t.closest('[data-pad]');if(pr){S.open={pad:pr.dataset.pad};render();return}
 const so=t.closest('[data-sort]');if(so){const k=so.dataset.sort,o=S.ord||{};S.ord={k,d:o.k===k?-o.d:(k==='deuda'?-1:1)};render();return}
 const sp=t.closest('[data-savepad]');if(sp){const id=sp.dataset.savepad,v=$('#pnota').value;sp.disabled=true;const {error}=await sb.rpc('guardar_nota_padron',{p_id:id,p_nota:v});sp.disabled=false;
  if(error){$('#pmsg').innerHTML=`<span class="err">No se pudo guardar: ${esc(error.message)}</span>`;return}const x=S.padron.find(y=>y.id===id);if(x){x.nota=v.trim()||null;x.nota_en=new Date().toISOString()}render();return}
 if(t.closest('[data-close]')){S.open=null;S.edit=null;render();return}
 const kp=t.closest('[data-kpi]');if(kp){const [v,x]=kp.dataset.kpi.split('|');S.v=v;S.q='';if(v==='lista')S.f=x;if(v==='faltan')S.pf=x;if(v==='plano')S.zoom=null;render();const tb=$('#main .tabs');if(tb)tb.scrollIntoView({behavior:'smooth',block:'start'});return}
 const v=t.closest('[data-v]');if(v){S.v=v.dataset.v;render();return}
 const f=t.closest('[data-f]');if(f){S.f=f.dataset.f;render();return}
 const z=t.closest('[data-zoom]');if(z){const d=+z.dataset.zoom;if(d===0){S.zoom=1;sizeMap();const mb=$('#mapbox');if(mb){mb.scrollLeft=0;mb.scrollTop=0}}else setZoom(S.zoom*(d>0?1.25:1/1.25));return}
 if(t.id==='reload'){await loadData();return}
 const pf=t.closest('[data-pf]');if(pf){S.pf=pf.dataset.pf;render();return}
 if(t.id==='backup'){backup();return}
 if(t.id==='out'){await sb.auth.signOut();S.miembro=null;S.user=null;S.open=null;vLogin();return}
 const rs=t.closest('[data-reset]');if(rs){const id=+rs.dataset.reset,f=S.fichas.find(x=>x.id===id),box=$('#rst-'+id);
  if(rs.dataset.confirm!=='1'){rs.dataset.confirm='1';rs.textContent='Confirmar: generar contraseña nueva';box.innerHTML='<p class="help">La contraseña actual deja de funcionar y se cierran sus sesiones abiertas.</p>';return}
  rs.disabled=true;const {data:pw,error}=await sb.rpc('resetear_pass_socio',{p_ficha_id:id});rs.disabled=false;rs.dataset.confirm='';rs.textContent='Resetear contraseña de la app';
  if(error){box.innerHTML=`<div class="err">No se pudo resetear: ${esc(error.message)}</div>`;return}
  const msg=`Hola, te escribimos de la Comisión de Aguará Guazú Country. Para entrar a la app del barrio tu usuario es tu DNI (${docKey(f.titular_documento)}) y tu contraseña provisoria es ${pw}. Al entrar podés cambiarla por una tuya.`;
  const g=String(f.celular||'').replace(/\D/g,'');const wa=g.length>=12?'https://wa.me/'+g+'?text='+encodeURIComponent(msg):null;
  box.innerHTML=`<div class="note" style="display:grid;gap:6px"><div>Contraseña provisoria: <b class="mono" style="font-size:18px">${esc(pw)}</b></div><div class="help">Se muestra una sola vez. Pasásela al socio${f.estado!=='verificada'?' (va a poder entrar cuando la ficha esté verificada)':''}.</div>${wa?`<div><a class="btn sm primary" href="${wa}" target="_blank" rel="noopener">Enviar por WhatsApp</a></div>`:'<div class="help">La ficha no tiene celular: pasásela por otro medio.</div>'}</div>`;return}
 const st=t.closest('[data-set]');if(st){const id=+st.dataset.id;st.disabled=true;
  const cur=S.fichas.find(x=>x.id===id),upd={estado:st.dataset.set,nota_comision:($('#nota-'+id).value||null)};if(!cur||cur.estado!==st.dataset.set){upd.revisado_por=S.user.id;upd.revisado_en=new Date().toISOString()}
  const {error}=await sb.from('fichas').update(upd).eq('id',id);
  if(error){st.disabled=false;$('#ferr-'+id).textContent='No se pudo guardar: '+error.message;return}const keep=S.open;await loadData();S.open=keep;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.open){S.open=null;S.edit=null;render()}const lt=e.target.closest&&e.target.closest('[data-lot]');if(lt&&e.key==='Enter'){S.open={lot:lt.dataset.lot};render()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;const p=e.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(p,p)}});
function backup(){const c=v=>{v=v==null?'':String(v);return/[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
 const H=['tramite','recibida','estado','es_prueba','titular','documento','email','celular','lotes_declarados','lotes','lote_sin_identificar','domicilio','acepta_avisos','vehiculos','nota_comision','datos_completos_json'];
 const L=S.fichas.map(f=>{const d=f.datos||{},dm=d.domicilio_real||{};return[f.tramite,new Date(f.creado).toLocaleString('es-AR'),f.estado,f.es_prueba?'sí':'no',f.titular_nombre,f.titular_documento,f.email,f.celular,f.cantidad_lotes,(f.ficha_lotes||[]).map(x=>x.lote_id+(x.reclamo?' (reclamo)':'')).join(', '),f.lote_sin_identificar,[dm.calle,dm.localidad,dm.provincia,dm.cp].filter(Boolean).join(', '),d.acepta_notificacion_electronica?'sí':'no',(d.vehiculos||[]).map(v=>v.patente).join(', '),f.nota_comision,JSON.stringify(d)].map(c).join(';')});
 const blob=new Blob(['﻿'+[H.join(';')].concat(L).join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='aguara_fichas_'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
start();
