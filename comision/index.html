function matchPad(f){if(!S.padron)return null;const k=docKey(f.titular_documento);let p=k&&S.padron.find(x=>docKey(x.documento)===k),via='documento';
 if(!p){const ft=norm(f.titular_nombre);let best=null,bs=0;for(const x of S.padron){const pt=norm(x.nombre);const c=pt.filter(w=>ft.includes(w)).length;const sc=c/Math.max(pt.length,ft.length,1);if(c>=2&&sc>bs){bs=sc;best=x}}p=best;via='nombre'}
 if(!p)return{p:null};
 const it=[];const add=(n,w,st,fv,pv)=>it.push({n,w,st,fv,pv});
 // documento
 add('DNI / CUIT',40,!p.documento?'nd':docKey(p.documento)===k?'ok':'no',f.titular_documento,p.documento);
 // nombre
 {const ft=norm(f.titular_nombre),pt=norm(p.nombre),c=pt.filter(w=>ft.includes(w)).length;add('Nombre',15,!pt.length?'nd':c>=Math.min(2,pt.length)&&c/pt.length>=.5?'ok':c>=1?'mid':'no',f.titular_nombre,p.nombre)}
 // lotes
 {const fl=(f.ficha_lotes||[]).map(x=>x.lote_id),pl=lotIds(p.lotes_plano),cand=/confirmar|\bo\b/i.test(p.lotes_plano||'');const nP=p.lotes_cobranza??p.lotes_padron;
  if(pl.length){const hit=fl.filter(x=>pl.includes(x)).length;let st=hit===fl.length&&(cand||fl.length===pl.length)?'ok':hit?'mid':'no';if(st==='ok'&&nP!=null&&nP!==fl.length)st='mid';add(st==='mid'&&hit===fl.length?'Lotes (no coincide la cantidad)':'Lotes',25,st,fl.join(', ')||'—',p.lotes_plano+(nP!=null?` (${nP} según ${p.lotes_cobranza!=null?'cobranza':'padrón'})`:''))}
  else if(nP!=null)add('Cantidad de lotes',25,nP===fl.length?'ok':'no',String(fl.length),`${nP} según ${p.lotes_cobranza!=null?'cobranza':'padrón'}`);
  else add('Lotes',25,'nd',fl.join(', ')||'—','sin dato')}
 // celular
 {const a=digs(f.celular),b=digs(p.celular);add('Celular',10,!b.length?'nd':a.some(x=>b.includes(x))?'ok':'no',f.celular,p.celular)}
 // email
 {const a=String(f.email||'').trim().toLowerCase(),b=String(p.email||'').trim().toLowerCase();add('Email',10,!b?'nd':a===b?'ok':'no',f.email,p.email)}
